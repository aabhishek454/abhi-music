plugins { id 'com.android.application' }

def releaseKeystore = System.getenv('ABHI_KEYSTORE')
def releaseStorePassword = System.getenv('ABHI_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('ABHI_KEY_PASSWORD')
def hasReleaseKey = releaseKeystore && releaseStorePassword && releaseKeyPassword

android {
    namespace 'com.abhishek.abhimusic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abhishek.abhimusic'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '1.8.0'
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias 'abhi-music'
                keyPassword releaseKeyPassword
            }
        }
    }

    lint { checkReleaseBuilds false; abortOnError false }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }
}
