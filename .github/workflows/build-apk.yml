name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Assemble Abhi Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform
        run: |
          set +e
          timeout 90 bash -c 'yes | sdkmanager --licenses' || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | head -50
          set -e

      - name: Build release APK
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: collect
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then
            echo "No APK produced"
            find android/app/build -type f | head -100
            exit 1
          fi
          cp "$APK" dist/AbhiMusic-v1.8.0.apk
          ls -lh dist/AbhiMusic-v1.8.0.apk
          echo "size=$(wc -c < dist/AbhiMusic-v1.8.0.apk)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiMusic-v1.8.0-apk
          path: dist/AbhiMusic-v1.8.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release (public)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: Abhi Music v1.8.0 — Android APK
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Abhi Music for Android **v1.8.0**

            ### Download
            Install **`AbhiMusic-v1.8.0.apk`** (attached below).

            ### Requirements
            - Android **7.0+** (API 24)
            - Internet for catalogue + YouTube full songs

            ### Install steps
            1. Download the APK on your phone
            2. Settings → allow **Install unknown apps** for Files / Chrome
            3. Open the file → **Install**

            ### What's inside
            - Web app v1.8 (FULL / PREVIEW badges, polish)
            - Native background playback for free mix
            - Notification + lock-screen controls
            - EQ, speed, offline mix, Android Auto
            - Picture-in-Picture for YouTube

            Live web app: https://abhi-music-amber.vercel.app
          files: |
            dist/AbhiMusic-v1.8.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
