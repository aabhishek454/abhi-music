name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Assemble Abhi Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mingc/android-build-box:1.29.0
    steps:
      - uses: actions/checkout@v4

      - name: Build release APK
        working-directory: android
        run: |
          java -version
          echo "sdk.dir=$ANDROID_HOME" > local.properties || echo "sdk.dir=/opt/android-sdk" > local.properties
          if [ -d /opt/android-sdk ]; then echo "sdk.dir=/opt/android-sdk" > local.properties; fi
          if [ -d /usr/local/lib/android/sdk ]; then echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties; fi
          if [ -n "$ANDROID_SDK_ROOT" ]; then echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties; fi
          cat local.properties
          ls -la /opt 2>/dev/null || true
          ls -la /usr/local/lib/android 2>/dev/null || true
          # Use system gradle or install wrapper
          gradle wrapper --gradle-version 8.7 || true
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -name '*.apk' 2>/dev/null | head -n 1)
          echo "Found: $APK"
          test -n "$APK"
          cp "$APK" dist/AbhiMusic-v1.8.0.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: AbhiMusic-v1.8.0-apk
          path: dist/AbhiMusic-v1.8.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0-apk
          name: Abhi Music APK v1.8.0
          body: |
            ## Abhi Music Android v1.8.0

            Download **AbhiMusic-v1.8.0.apk** and install on Android 7+.

            1. Download on phone
            2. Allow unknown sources
            3. Install

            Opens: https://abhi-music-amber.vercel.app
          files: dist/AbhiMusic-v1.8.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
