name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Assemble Abhi Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $APK"
          test -n "$APK"
          cp "$APK" dist/AbhiMusic-v1.8.0.apk
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiMusic-v1.8.0-apk
          path: dist/AbhiMusic-v1.8.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0-apk
          name: Abhi Music APK v1.8.0
          body: |
            ## Abhi Music for Android **v1.8.0**

            Download `AbhiMusic-v1.8.0.apk` below and install on Android 7+.

            ### Included
            - Web app v1.8 (full/preview badges, skeletons, polish)
            - Native background playback for free mix
            - Notification + lock-screen controls
            - EQ · speed · offline mix · Android Auto
            - Picture-in-Picture for YouTube videos

            ### Install steps
            1. Download the APK on your phone
            2. Allow **Install unknown apps** for Files/Chrome
            3. Open the APK → Install

            Live site: https://abhi-music-amber.vercel.app
          files: dist/AbhiMusic-v1.8.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
