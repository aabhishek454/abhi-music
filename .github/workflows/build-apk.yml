name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Assemble Abhi Music APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept licenses & build release APK
        working-directory: android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          gradle assembleRelease --no-daemon --stacktrace

      - name: List outputs
        run: find android/app/build/outputs -type f -name '*.apk' -ls || true

      - name: Rename APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$APK" dist/AbhiMusic-v1.8.0.apk
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbhiMusic-v1.8.0-apk
          path: dist/AbhiMusic-v1.8.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0-apk
          name: Abhi Music APK v1.8.0
          body: |
            ## Abhi Music for Android v1.8.0

            Install this APK on Android 7+.

            ### What's included
            - Full web app (v1.8 polish) via WebView
            - Native background playback for free mix
            - Notification / lock-screen controls
            - EQ, speed, offline mix, Android Auto tree
            - Picture-in-Picture for official videos

            ### Install
            1. Download `AbhiMusic-v1.8.0.apk`
            2. On phone: allow *Install unknown apps* for your browser/Files
            3. Open the APK and install

            App opens: https://abhi-music-amber.vercel.app
          files: dist/AbhiMusic-v1.8.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
