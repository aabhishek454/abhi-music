name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Assemble Abhi Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/tmp/licenses.log 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Build release APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          echo "Found: $APK"
          test -n "$APK"
          cp "$APK" dist/AbhiMusic-v1.9.1.apk
          ls -lh dist/AbhiMusic-v1.9.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AbhiMusic-v1.9.1-apk
          path: dist/AbhiMusic-v1.9.1.apk

      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.1
          name: Abhi Music v1.9.1 — Android APK
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Abhi Music for Android **v1.9.1**

            Download **AbhiMusic-v1.9.1.apk** below.

            ### What's fixed
            - **Mini player plays instantly** — tapping play no longer opens the full window first
            - **True background play** — music keeps going when you close the full player or leave the app (native service + YouTube PiP)
            - Close full screen without stopping the track

            ### Install
            1. Download on your phone
            2. Allow *Install unknown apps*
            3. Open → Install

            Android 7+ · package `com.abhishek.abhimusic`

            Web: https://abhi-music-amber.vercel.app
          files: dist/AbhiMusic-v1.9.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
