name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Assemble Abhi Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 34
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | head -40

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $APK"
          test -n "$APK"
          cp "$APK" dist/AbhiMusic-v1.8.0.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: AbhiMusic-v1.8.0-apk
          path: dist/AbhiMusic-v1.8.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0-apk
          name: Abhi Music APK v1.8.0
          body: |
            ## Abhi Music Android v1.8.0

            Install `AbhiMusic-v1.8.0.apk` on Android 7+.

            1. Download the APK
            2. Allow install from unknown sources
            3. Open → Install

            App loads: https://abhi-music-amber.vercel.app
          files: dist/AbhiMusic-v1.8.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
